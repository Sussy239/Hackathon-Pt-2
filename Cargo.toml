[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arrow = { version = "53.3", default-features = false, features = ["prettyprint"] }
parquet = { version = "53.3", default-features = false, features = ["arrow", "snappy"] }
rayon = "1.10"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true